paths:
  /{entityId}/switchgear/registration:
    post:
      tags:
        - Operacje rozdzielni
      summary: Przesłanie zgłoszenia rejestracyjnego
      operationId: switchgear-save-registration
      parameters:
        - name: entityId
          in: path
          description: Identyfikator podmiotu wykonującego daną operację
          required: true
          schema:
            type: string
          example: 12345
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                data:
                  $ref: "#/components/schemas/SwitchgearRegistrationRequest"
                diagram:
                  type: string
                  format: binary
                  description: |
                    Opcjonalny plik schemat i układ pracy rozdzielni.
                    Należy przesłać jako plik w części 'diagram'.
              required:
                - data
            example:
              data:
                registrationTerms:
                  operationStartDate: 2024-11-01
                  operationEndDate: 2025-10-31
                basicData:
                  businessPartnerCountryId: PL
                  latitude: "50"
                  owningBusinessPartner: 99999
                  longitude: "15"
                  odmBusinessPartner: 99999
                  substation:
                    mrid: _ffffffff-aaaa-bbbb-cccc-000000000001
                  osdpBusinessPartner: 99999
                  osdnBusinessPartner: 99999
                  osdpBusinessPartner2: 99999
                  sesaId: 1
                  diagramFileUploadInfo:
                    id: 100
                    object: 00000000-aaaa-bbbb-cccc-000000000001_dane.txt
                    objectMrid: _00000000-aaaa-bbbb-cccc-000000000001
                    originalFileName: dane.txt
                    createdTs: 2026-10-19T15:16:32.371Z
                    origin: PWDS
                  voltage:
                    mrid: _00000000-aaaa-bbbb-cccc-000000000001
                    valueKv: 15.75
                defenseReconstruction:
                  isActive: T
                parentUuid: _11111111-aaaa-bbbb-cccc-000000000001
              diagram: <binary file>
      responses:
        "200":
          description: Zapisywanie zgłoszeń rejestracyjnych
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestSubmitResponse"
        "4xx":
          description: Informacje dotyczące komunikatu błędu - błąd użytkownika
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseErrorResponse"
        "5xx":
          description: Informacje dotyczące komunikatu błędu - błąd serwera
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseErrorResponse"
