          $ref: "#/components/schemas/FacilityRegistrationRequest"
          description: Nowo zarejestrowane ZWE (jeśli było niedostępne na liście)
        parentUuid:
          type: string
          format: uuid
          description: |
            UUID wskazujący który zgłoszenie które chcemy poprawić aktualnie wysyłanym zgłoszeniem - wskazując na parentUuid = <uuid1>
            informujemy że obecnie wysłane zgłoszenie jest korektą do zgłoszenia o <uuid1>. W przypadku łańcuszka korekt zawsze wskazujemy poprzedni element tj
            uuid1 -> uuid2 -> uuid3 ... uuidn wskazuje na historię zmian dla uuid1 z różnymi wersjami
            uuid1 - wersja inicjalna,
            uuid2 - wersja druga zgłoszenia o uuid1,
            uuid3 - wersja trzecia zgłoszenia o uuid1,
            uuidn - wersja n zgłoszenia o uuid1
          example: _11111111-aaaa-bbbb-cccc-000000000001
