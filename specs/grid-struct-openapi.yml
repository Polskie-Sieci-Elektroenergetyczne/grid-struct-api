  /{entityId}/storage/change/withFiles:
    post:
      tags:
        - Operacje magazynu
      summary: Przesłanie zgłoszenia strukturalnego z plikami
      operationId: storage-save-change-with-files
      parameters:
        - name: entityId
          in: path
          description: Identyfikator podmiotu wykonującego daną operację
          required: true
          schema:
            type: string
          example: 12345
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                data:
                  $ref: "#/components/schemas/StorageChangeRequest"
                powerOutputDiagrams:
                  type: array
                  description: |
                    Opcjonalna lista plików - schemat wyprowadzenia mocy: schemat jednokreskowy wyprowadzenia mocy i zasilania potrzeb własnych/ogólnych.
                    Należy przesłać jako plik w części 'powerOutputDiagrams'.
                  items:
                    type: string
                    format: binary
                lvfrtSym:
                  type: array
                  description: |
                    Opcjonalna lista plików - charakterystyki zwarciowe i napięciowe : LVFRT - zdolność do utrzymania w pracy podczas zwarcia symetrycznego.
                    Należy przesłać jako plik w części 'lvfrtSym'.
                  items:
                    type: string
                    format: binary
                lvfrtAsym:
                  type: array
                  description: |
                    Opcjonalna lista plików - charakterystyki zwarciowe i napięciowe : LVFRT - zdolność do utrzymania w pracy podczas zwarcia niesymetrycznego.
                    Należy przesłać jako plik w części 'lvfrtAsym'.
                  items:
                    type: string
                    format: binary
                hvfrtFiles:
                  type: array
                  description: |
                    Opcjonalna lista plików - charakterystyki zwarciowe i napięciowe : HVFRT - zdolność do utrzymania w pracy przy podwyższonym napięciu.
                    Należy przesłać jako plik w części 'hvfrtFiles'.
                  items:
                    type: string
                    format: binary
                ifuSym:
                  type: array
                  description: |
                    Opcjonalna lista plików - charakterystyki zwarciowe i napięciowe : Zdolność do generacji szybkiego prądu zwarciowego dla zwarcia symetrycznego – charakterystyka statyczna I=f(U)
                    Należy przesłać jako plik w części 'ifuSym'.
                  items:
                    type: string
                    format: binary
                ifuAsym:
                  type: array
                  description: |
                    Opcjonalna lista plików - charakterystyki zwarciowe i napięciowe : Zdolność do generacji szybkiego prądu zwarciowego dla zwarcia niesymetrycznego – charakterystyka statyczna I=f(U)
                    Należy przesłać jako plik w części 'ifuAsym'.
                  items:
                    type: string
                    format: binary
                pfuFiles:
                  type: array
                  description: |
                    Opcjonalna lista plików - regulacja napięcia i mocy biernej : charakterystyka P=f(U).
                    Należy przesłać jako plik w części 'pfuFiles'.
                  items:
                    type: string
                    format: binary
              required:
                - data
            example:
