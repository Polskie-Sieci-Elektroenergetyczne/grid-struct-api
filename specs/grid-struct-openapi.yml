          $ref: "#/components/schemas/BusinessPartnerRequestDto"
          description: Pełne dane właściciela
        nominalPower:
          type: number
          description: "Moc znamionowa filtra [Mvar]"
          example: 1234.123
          maximum: 9999.999
          minimum: 0.0
        nominalVoltage:
          type: number
          description: "Napięcie znamionowe [kV]"
