            uuid1 - wersja inicjalna,
            uuid2 - wersja druga zgłoszenia o uuid1,
            uuid3 - wersja trzecia zgłoszenia o uuid1,
            uuidn - wersja n zgłoszenia o uuid1
          example: _11111111-aaaa-bbbb-cccc-000000000001
        registrationTerms:
          $ref: "#/components/schemas/RegistrationTerms"
          description: Zgłoszenie rejestracji filtra - istotne terminy
        basicData:
          $ref: "#/components/schemas/ShuntFilterBasicDataRequest"
          description: Zgłoszenie rejestracji filtra - dane podstawowe
        objectMrid:
          type: string
          description: Identyfikator MRID dla obiektu zgłoszenia
          example: _11111111-aaaa-bbbb-cccc-000000000001
        validFromDate:
          type: string
          format: yyyy-MM-dd
          description: Data od obowiązywania parametrów
          example: 2020-12-20
      required:
        - objectMrid
        - validFromDate
